# Production stack for a single server (see deploy/README.md).
#   cp .env.example .env   # then edit
#   docker compose up -d --build

# Shared by the API and the reminder worker.
x-app-environment: &app-environment
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in deploy/.env}
  DATABASE_URL: postgres://librete:${POSTGRES_PASSWORD}@db:5432/librete
  ALLOWED_HOSTS: ${DOMAIN}
  CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
  FRONTEND_URL: https://${DOMAIN}
  # Calendar feed and data export links; the API shares the web app's origin.
  PUBLIC_URL: https://${DOMAIN}
  # The PWA is served from the same origin, so only the Capacitor (Android/iOS) webviews
  # need CORS.
  CORS_ALLOWED_ORIGINS: capacitor://localhost,https://localhost
  EMAIL_URL: ${EMAIL_URL:-consolemail://}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Librete <noreply@localhost>}
  ACCOUNT_EMAIL_VERIFICATION: ${ACCOUNT_EMAIL_VERIFICATION:-mandatory}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: librete
      POSTGRES_USER: librete
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U librete"]
      interval: 10s
      retries: 10

  api:
    build: ..
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy

  # Sends due event reminders via Web Push every 60 s (same image as the API).
  worker:
    build: ..
    restart: unless-stopped
    command: ["python", "manage.py", "send_reminders", "--loop"]
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "0"  # the API container runs them
    healthcheck:
      disable: true  # the image's healthcheck probes the API's HTTP port
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  db-data:
  caddy-data:
  caddy-config:
