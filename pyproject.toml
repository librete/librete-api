[project]
name = "librete-api"
version = "1.0.0"
description = "Librete personal organizer API"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "django-parler>=2.3",
    "django-allauth[headless]>=65.10",
    "django-environ>=0.12",
    "django-cors-headers>=4.7",
    "django-filter>=25",
    "drf-spectacular>=0.28",
    "whitenoise>=6.9",
    "gunicorn>=23",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "django-extensions>=4.1",
    "factory-boy>=3.3",
    "ipdb",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-django>=4.9",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "librete.settings_test"
python_files = ["test_*.py", "tests.py"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 99
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "C4", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101", "S105", "S106"]
"**/conftest.py" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["librete"]
